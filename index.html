
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM-Barang</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SIM-Barang</h1>
        <p>Sistem Inventaris Barang Jurusan</p>
    </header>

    <nav>
        <a href="#beranda">Beranda</a>
        <a href="#inventaris">Inventaris</a>
        <a href="#form">Tambah Barang</a>
    </nav>

    <main id="beranda">

        <section id="inventaris">
            <h2>Data Inventaris Barang</h2>
            <input type="text" id="cari" placeholder="Cari nama atau kode barang...">

        <table>
            <thead>
                <tr>
                    <th>Kode</th>
                    <th>Nama Barang</th>
                    <th>Kategori</th>
                    <th>Jumlah</th>
                    <th>Kondisi</th>
                </tr>
            </thead>

            <tbody id="daftarBarang">
                <tr>
                    <td>BRG-001</td>
                    <td>Komputer</td>
                    <td>Elektronik</td>
                    <td>10</td>
                    <td>Baik</td>
                </tr>
                <tr>
                    <td>BRG-002</td>
                    <td>Meja</td>
                    <td>Furniture</td>
                    <td>15</td>
                    <td>Baik</td>
                </tr>
            </tbody>
</table>
        </section>

        <section id="form">
            <h2>Form Input Barang</h2>

            <form id="barangForm">
    <label for="kode">Kode Barang</label>
    <input type="text" id="kode" placeholder="BRG-003" required>

    <label for="nama">Nama Barang</label>
    <input type="text" id="nama" placeholder="Nama barang" required>

    <label for="kategori">Kategori</label>
    <select id="kategori" required>
        <option value="">Pilih Kategori</option>
        <option>Elektronik</option>
        <option>Furniture</option>
        <option>Peralatan</option>
    </select>

    <label for="jumlah">Jumlah</label>
    <input type="number" id="jumlah" placeholder="Jumlah barang" required>

    <label for="kondisi">Kondisi</label>
    <select id="kondisi" required>
        <option value="">Pilih Kondisi</option>
        <option>Baik</option>
        <option>Rusak Ringan</option>
        <option>Rusak Berat</option>
    </select>

    <button type="submit">Simpan</button>
</form>

<div id="toast"></div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 SIM-Barang - Politeknik Negeri Sriwijaya</p>
    </footer>

    <script src="main.js" defer></script>

</body>
</html>
